name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write  # For uploading artifacts

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            libncurses5 libstdc++6 zlib1g \
            wget curl autoconf automake libtool
      
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-
      
      - name: Install Buildozer and dependencies
        run: |
          python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install buildozer cython==0.29.36 --break-system-packages
      
      - name: Apply patches
        run: |
          # Patch buildozer to use --break-system-packages instead of --user
          BUILDOZER_ANDROID=$(python3 -c "import site; import os; print(next((os.path.join(p, 'buildozer', 'targets', 'android.py') for p in site.getsitepackages() if os.path.exists(os.path.join(p, 'buildozer', 'targets', 'android.py'))), ''))")
          if [ -f "$BUILDOZER_ANDROID" ]; then
            sed -i 's/"--user"/"--break-system-packages"/g' "$BUILDOZER_ANDROID"
            echo "✅ Patched buildozer android.py"
          fi
          
          # Patch python-for-android checkdependencies
          P4A_CHECKDEPS=$(python3 -c "import site; import os; print(next((os.path.join(p, 'pythonforandroid', 'checkdependencies.py') for p in site.getsitepackages() if os.path.exists(os.path.join(p, 'pythonforandroid', 'checkdependencies.py'))), ''))")
          if [ -f "$P4A_CHECKDEPS" ]; then
            sed -i '/def check_and_install_default_prerequisites/,/^def / { /^def check_and_install_default_prerequisites/! { /^def /!d }; /^def check_and_install_default_prerequisites/a\    return  # SKIP: CI handles deps' }' "$P4A_CHECKDEPS"
            echo "✅ Patched p4a checkdependencies.py"
          fi
          
          # Patch python-for-android build.py
          P4A_BUILD=$(python3 -c "import site; import os; print(next((os.path.join(p, 'pythonforandroid', 'build.py') for p in site.getsitepackages() if os.path.exists(os.path.join(p, 'pythonforandroid', 'build.py'))), ''))")
          if [ -f "$P4A_BUILD" ]; then
            sed -i 's/\["pip", "install"\]/["pip", "install", "--break-system-packages"]/g' "$P4A_BUILD"
            echo "✅ Patched p4a build.py"
          fi
      
      - name: Build APK
        id: build
        run: |
          echo "🔨 Starting Buildozer android debug build..."
          echo "This may take 15-30 minutes on first run..."
          
          # Set environment to skip prompts
          export BUILDOZER_WARN_ON_ROOT=0
          export PYTHONFORANDROID_SKIP_PREREQUISITES=1
          
          # Run build with verbose output
          buildozer -v android debug 2>&1 | tee build.log
          
          # Check if APK was created
          APK_FILE=$(find bin -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK_FILE" ]; then
            echo "APK_PATH=$APK_FILE" >> $GITHUB_OUTPUT
            echo "✅ Build successful! APK: $APK_FILE"
          else
            echo "❌ Build failed - no APK found"
            echo "Last 100 lines of build log:"
            tail -100 build.log
            exit 1
          fi
      
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-apk
          path: ${{ steps.build.outputs.APK_PATH }}
          retention-days: 30
      
      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.APK_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR with APK link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            github.rest.issues.createComment({
              issue_number: ${{ github.event.pull_request.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Android APK built successfully!**\n\nDownload from workflow artifacts: ${artifactUrl}\n\n*Built from commit ${{ github.sha }}*`
            })
